
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Boutique Plus - Connexion</title>

    <!-- Police Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    
</head>

<body>
    <style>
        
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Roboto', sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #2d4b84, #283b54);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* Conteneur principal */
.container {
    width: 100%;
    max-width: 450px;
}

/* Carte de connexion */
.login-box {
    background: rgba(255, 255, 255, 0.96);
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
}

/* Logo */
.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo {
    font-size: 35px;
}

.logo h1 {
    font-size: 25px;
    color: #17243c;
    margin-top: 8px;
}

.logo p {
    font-size: 13px;
    color: #71809b;
    margin-top: 5px;
}

/* Onglets */
.tabs {
    display: flex;
    background: #edf1f8;
    padding: 5px;
    border-radius: 10px;
    margin-bottom: 25px;
}

.tab {
    flex: 1;
    padding: 12px 5px;
    border: none;
    background: transparent;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    color: #526078;
    transition: .3s;
}

.tab.active {
    background: #0875ff;
    color: white;
}

/* Formulaires */
.form h2 {
    color: #17243c;
    font-size: 23px;
    margin-bottom: 7px;
}

.subtitle {
    color: #71809b;
    font-size: 14px;
    margin-bottom: 22px;
}

/* Champs */
.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: #17243c;
    font-size: 14px;
}

.form-group input {
    width: 100%;
    height: 46px;
    padding: 0 13px;
    border: 1px solid #d5deeb;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
    transition: .3s;
}

.form-group input:focus {
    border-color: #0875ff;
    box-shadow: 0 0 0 3px rgba(8, 117, 255, .12);
}

.form-group input::placeholder {
    color: #a0aabd;
}

/* Bouton */
.submit-btn {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #0875ff, #0054d9);
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: .3s;
    margin-top: 8px;
}

.submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(8, 117, 255, .25);
}

/* Masquer un formulaire */
.hidden {
    display: none;
}

/* Pied de page */
.footer {
    text-align: center;
    color: #8a96a9;
    font-size: 12px;
    margin-top: 25px;
}

/* Adaptation mobile */
@media (max-width: 480px) {
    .login-box {
        padding: 25px 20px;
    }

    .logo h1 {
        font-size: 22px;
    }
}
/* NOTIFICATIONS PERSONNALISÉES */

.notification {
    position: fixed;
    top: 25px;
    right: 25px;
    width: 350px;
    min-height: 85px;

    background: white;
    display: flex;
    align-items: center;
    gap: 15px;

    padding: 18px;
    border-radius: 12px;

    box-shadow: 0 8px 30px rgba(0,0,0,0.15);

    transform: translateX(120%);
    opacity: 0;

    transition: all 0.5s ease;
    z-index: 9999;
    overflow: hidden;
}

/* Apparition */
.notification.show {
    transform: translateX(0);
    opacity: 1;
}

/* Icône */
.notification-icon {
    width: 45px;
    height: 45px;
    min-width: 45px;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #19bd72;
    border-radius: 50%;

    font-size: 27px;
}
/* Texte */
.notification-content strong {
    display: block;
    color: #17243c;
    font-size: 16px;
    margin-bottom: 5px;
}

.notification-content p {
    color: #71809b;
    font-size: 13px;
    line-height: 1.4;
}

/* Bouton fermer */
.close-notification {
    margin-left: auto;
    border: none;
    background: none;
    font-size: 22px;
    color: #71809b;
    cursor: pointer;
}

/* Barre de progression */
.notification-progress {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: #19bd72;
}

.notification.show .notification-progress {
    animation: progress 4s linear forwards;
}

@keyframes progress {
    from {
        width: 100%;
    }

    to {
        width: 0;
    }
}

/* Notification erreur */
.notification.error .notification-icon {
    background: #e53935;
}

.notification.error .notification-progress {
    background: #e53935;
}

/* Notification information */
.notification.info .notification-icon {
    background: #0875ff;
}

.notification.info .notification-progress {
    background: #0875ff;
}

/* Adaptation mobile */
@media (max-width: 480px) {
    .notification {
        width: calc(100% - 30px);
        right: 15px;
        top: 15px;
    }
}
    </style>
<!-- Zone des notifications -->
<div id="notification" class="notification">
    <div class="notification-icon" id="notificationIcon">🎉</div>

    <div class="notification-content">
        <strong id="notificationTitle">Bravo !</strong>
        <p id="notificationMessage">
            Votre compte a été créé avec succès.
        </p>
    </div>

    <button class="close-notification"
        onclick="closeNotification()">×</button>

    <div class="notification-progress"></div>
</div>
<div class="container">

    <div class="login-box">

        <!-- Logo -->
        <div class="logo">
            🛒
            <h1>Boutique Plus</h1>
            <p>Gestion Commerciale</p>
        </div>

        <!-- Boutons de navigation -->
        <div class="tabs">
            <button class="tab active" id="loginTab"
                onclick="showLogin()">
                Connexion
            </button>

            <button class="tab" id="registerTab"
                onclick="showRegister()">
                Créer un compte
            </button>
        </div>

        <!-- FORMULAIRE CONNEXION -->
        <form id="loginForm" class="form">

            <h2>Bienvenue !</h2>
            <p class="subtitle">Connectez-vous à votre espace</p>

            <div class="form-group">
                <label>Nom utilisateur</label>
                <input type="text"
                    name="username"
                    placeholder="Votre nom utilisateur"
                    required>
            </div>

            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password"
                    name="password"
                    placeholder="Votre mot de passe"
                    required>
            </div>

            <button type="submit" class="submit-btn">
                Se connecter
            </button>

        </form>

        <!-- FORMULAIRE INSCRIPTION -->
        <form id="registerForm" class="form hidden">

            <h2>Créer un compte</h2>
            <p class="subtitle">Remplissez les informations ci-dessous</p>

            <div class="form-group">
                <label>Nom</label>
                <input type="text"
                    name="nom"
                    placeholder="Votre nom"
                    required>
            </div>

            <div class="form-group">
                <label>Prénom</label>
                <input type="text"
                    name="prenom"
                    placeholder="Votre prénom"
                    required>
            </div>

            <div class="form-group">
                <label>Nom utilisateur</label>
                <input type="text"
                    name="username"
                    placeholder="Choisissez un nom utilisateur"
                    required>
            </div>

            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password"
                    id="password"
                    name="password"
                    placeholder="Créer un mot de passe"
                    minlength="8"
                    required>
            </div>

            <div class="form-group">
                <label>Confirmer le mot de passe</label>
                <input type="password"
                    id="confirmPassword"
                    name="confirm_password"
                    placeholder="Confirmer votre mot de passe"
                    minlength="8"
                    required>
            </div>

            <button type="submit" class="submit-btn">
                Créer mon compte
            </button>

        </form>

        <p class="footer">
            © 2026 Boutique Plus - Gestion Commerciale
        </p>

    </div>

</div>

<script>
    
/* =====================================
   BOUTIQUE PLUS - CONNEXION.JS
===================================== */

// Référence à la notification
let notificationTimer;


// =====================================
// 1. AFFICHER UNE NOTIFICATION
// =====================================

function showNotification(type, title, message) {

    const notification = document.getElementById("notification");

    const icon = document.getElementById("notificationIcon");

    const notificationTitle = document.getElementById("notificationTitle");

    const notificationMessage = document.getElementById("notificationMessage");


    // Définir le titre et le message
    notificationTitle.textContent = title;

    notificationMessage.textContent = message;


    // Réinitialiser les classes
    notification.className = "notification";


    // Choisir l'emoji selon le type
    if (type === "success") {

        icon.textContent = "🎉";

    }

    else if (type === "error") {

        icon.textContent = "😢";

        notification.classList.add("error");

    }

    else {

        icon.textContent = "🔔";

        notification.classList.add("info");

    }


    // Relancer l'animation
    void notification.offsetWidth;

    notification.classList.add("show");


    // Supprimer l'ancien minuteur
    clearTimeout(notificationTimer);


    // Fermer automatiquement après 4 secondes
    notificationTimer = setTimeout(function() {

        closeNotification();

    }, 4000);

}



// =====================================
// 2. FERMER UNE NOTIFICATION
// =====================================

function closeNotification() {

    const notification = document.getElementById("notification");

    notification.classList.remove("show");

    clearTimeout(notificationTimer);

}



// =====================================
// 3. AFFICHER LE FORMULAIRE CONNEXION
// =====================================

function showLogin() {

    document.getElementById("loginForm")
        .classList.remove("hidden");

    document.getElementById("registerForm")
        .classList.add("hidden");


    // Activer l'onglet connexion
    document.getElementById("loginTab")
        .classList.add("active");

    document.getElementById("registerTab")
        .classList.remove("active");

}



// =====================================
// 4. AFFICHER LE FORMULAIRE INSCRIPTION
// =====================================

function showRegister() {

    document.getElementById("registerForm")
        .classList.remove("hidden");

    document.getElementById("loginForm")
        .classList.add("hidden");


    // Activer l'onglet inscription
    document.getElementById("registerTab")
        .classList.add("active");

    document.getElementById("loginTab")
        .classList.remove("active");

}



// =====================================
// 5. VERIFICATION DU FORMULAIRE INSCRIPTION
// =====================================

document.getElementById("registerForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    // Récupérer les mots de passe
    let password = document.getElementById("password").value;

    let confirmPassword = document.getElementById("confirmPassword").value;


    // Vérifier si les mots de passe sont identiques
    if (password !== confirmPassword) {

        showNotification(
            "error",
            "Oups !",
            "Les mots de passe ne correspondent pas. Veuillez réessayer."
        );

        return;

    }


    // Vérifier la longueur du mot de passe
    if (password.length < 8) {

        showNotification(
            "error",
            "Mot de passe trop court !",
            "Votre mot de passe doit contenir au moins 8 caractères."
        );

        return;

    }


    // Message de succès (démonstration uniquement)
    showNotification(
        "success",
        "Bravo !",
        "Votre compte a été créé avec succès."
    );


    // Réinitialiser le formulaire
    this.reset();

});



// =====================================
// 6. VERIFICATION DU FORMULAIRE CONNEXION
// =====================================

document.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    // Récupérer les informations
    let username = this.querySelector('[name="username"]').value;

    let password = this.querySelector('[name="password"]').value;


    // Vérifier les champs
    if (username.trim() === "" || password.trim() === "") {

        showNotification(
            "error",
            "Attention !",
            "Veuillez remplir tous les champs."
        );

        return;

    }


    // Message de démonstration
    showNotification(
        "info",
        "Connexion",
        "Votre demande de connexion est en cours de traitement."
    );

});

</script>

</body>
</html>
